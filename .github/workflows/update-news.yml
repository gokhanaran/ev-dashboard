name: Update dashboard news

on:
  schedule:
    # GitHub cron can be delayed. One hourly run stays alive and refreshes
    # the feed every 5 minutes, so freshness does not depend on cron firing
    # every five minutes.
    - cron: "2 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: dashboard-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh news every 5 minutes
        shell: bash
        run: |
          git config user.name "ev-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 12); do
            echo "=== Refresh $i/12 ==="

            git pull --rebase origin main
            python scripts/update_news.py

            if ! git diff --quiet -- news.json; then
              git add news.json
              git commit -m "Update dashboard news [skip ci]"
              git push origin HEAD:main
            else
              echo "No news changes."
            fi

            if [ "$i" -lt 12 ]; then
              sleep 300
            fi
          done
