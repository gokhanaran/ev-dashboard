name: Update dashboard news

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: dashboard-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect RSS feeds
        run: python scripts/update_news.py

      - name: Commit fresh news
        shell: bash
        run: |
          if git diff --quiet -- news.json; then
            echo "No news changes."
            exit 0
          fi

          git config user.name "ev-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update dashboard news [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
