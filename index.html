<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Ev Dashboard</title>
  <!-- pages-redeploy -->
  <!-- build: bg-v3-weather-icons-cachebust-20260924 -->
  <style>
    :root{
      --bg:#0b0f14; --panel:#131a22; --panel2:#10161d; --text:#f5f7fa;
      --muted:#98a4b3; --accent:#75b9ff; --line:#22303d; --warn:#ffd166;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    body{padding:22px}
    .grid{height:100%;display:grid;grid-template-columns:0.95fr 1.35fr;grid-template-rows:auto 1fr auto;gap:16px}
    .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
      border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
    .clock{grid-column:1;grid-row:1;display:flex;align-items:flex-end;justify-content:space-between}
    #time{font-size:72px;font-weight:750;line-height:.9;letter-spacing:-4px}
    #date{font-size:21px;color:var(--muted);text-align:right}
    .weather{grid-column:1;grid-row:2}
    .weatherMain{display:flex;align-items:center;gap:18px;margin-top:8px}
    #temp{font-size:64px;font-weight:700;letter-spacing:-3px}
    #weatherText{font-size:24px}
    .forecast{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
    .day{padding:12px;border:1px solid var(--line);border-radius:16px;text-align:center}
    .day .d{font-size:14px;color:var(--muted);margin-bottom:7px}
    .day .t{font-size:20px;font-weight:700}
    .news{grid-column:2;grid-row:1 / span 2;overflow:hidden}
    .title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .title h2{margin:0;font-size:24px}
    .small{font-size:13px;color:var(--muted)}
    #newsList{display:flex;flex-direction:column;gap:0}
    .newsItem{padding:15px 4px;border-bottom:1px solid var(--line)}
    .newsItem:last-child{border-bottom:none}
    .newsItem .n{font-size:20px;line-height:1.28}
    .newsItem .meta{font-size:12px;color:var(--muted);margin-top:6px}
    .note{grid-column:1 / span 2;grid-row:3;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px}
    .noteLabel{font-size:15px;color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    #note{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status{position:fixed;right:12px;bottom:7px;color:#536170;font-size:10px}
    @media (max-width:900px){
      body{padding:14px}.grid{grid-template-columns:1fr 1.3fr;gap:12px}
      .card{padding:15px;border-radius:16px}#time{font-size:56px}.forecast{gap:6px}
      .day{padding:8px}.newsItem{padding:11px 2px}.newsItem .n{font-size:17px}#note{font-size:20px}
    }
  </style>

  <style id="dakboard-inspired-style">
    html{background:#080b10} body{background:#080b10 url("https://picsum.photos/id/1018/1920/1080") center/cover fixed no-repeat}
    body{position:relative;isolation:isolate}
    .bg-layer{
      position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
      opacity:0;transition:opacity 1.8s ease;z-index:0;pointer-events:none;
      transform:scale(1.015);
    }
    .bg-layer.active{opacity:1}
    .bg-shade{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      background:
        linear-gradient(90deg,rgba(3,8,14,.30) 0%,rgba(3,8,14,.12) 47%,rgba(3,8,14,.26) 100%),
        linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,.06) 50%,rgba(0,0,0,.22) 100%);
    }
    .grid{position:relative;z-index:2}
    .card{
      background:linear-gradient(180deg,rgba(8,14,21,.24),rgba(8,14,21,.12));
      border:1px solid rgba(255,255,255,.13);
      box-shadow:0 12px 34px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter:blur(3px) saturate(108%);\n      -webkit-backdrop-filter:blur(3px) saturate(108%);
    }
    .clock{
      background:linear-gradient(180deg,rgba(8,14,21,.20),rgba(8,14,21,.10));
    }
    #time{
      color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.5);
      font-weight:700;
    }
    #date,.small,.day .d{color:rgba(238,246,255,.72)}
    .title h2,.newsItem .n,#weatherText,#note,.day .t{ text-shadow:0 1px 8px rgba(0,0,0,.32) }
    .day{
      background:rgba(7,13,20,.08);
      border-color:rgba(255,255,255,.12);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }
    .newsItem{border-bottom-color:rgba(255,255,255,.12)}
    .note{background:rgba(8,14,21,.18)}
    .status{z-index:3;color:rgba(255,255,255,.36)}
    @media (max-width:900px){\n      .card{backdrop-filter:blur(2px) saturate(105%);-webkit-backdrop-filter:blur(2px) saturate(105%)}\n    }
  
    .weatherMain{justify-content:flex-start}
    .currentIcon{width:76px;height:76px;display:flex;align-items:center;justify-content:center;margin-left:auto}
    .wxIcon{width:56px;height:56px;display:block}
    .wxIcon svg{width:100%;height:100%;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
      filter:drop-shadow(0 2px 5px rgba(0,0,0,.28))}
    .forecast .day{padding:10px 8px 12px}
    .day .d{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.24);
      color:#fff;font-size:13px;font-weight:700;letter-spacing:.02em;margin-bottom:9px}
    .day .wxIcon{width:42px;height:42px;margin:0 auto 4px}
    .day .rain{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#fff;margin:2px 0 8px}
    .dropIcon{width:12px;height:12px;display:inline-block}
    .dropIcon svg{width:100%;height:100%;fill:#fff;stroke:none}
    .day .temps{display:flex;justify-content:center;gap:14px;font-size:18px}
    .day .temps .max{font-weight:700}
    .day .temps .min{font-weight:500;color:rgba(255,255,255,.85)}

  </style>

</head>
<body>
  <img id="bgA" class="bg-layer" alt="" aria-hidden="true">
  <img id="bgB" class="bg-layer" alt="" aria-hidden="true">
  <div class="bg-shade" aria-hidden="true"></div>
  <main class="grid">
    <section class="card clock">
      <div id="time">--:--</div>
      <div id="date">--</div>
    </section>

    <section class="card weather">
      <div class="title"><h2>Yakuplu · Hava</h2><span class="small" id="weatherUpdated"></span></div>
      <div class="weatherMain">
        <div id="temp">--°</div>
        <div>
          <div id="weatherText">Yükleniyor…</div>
          <div class="small" id="weatherExtra"></div>
        </div>
        <div class="currentIcon" id="currentWeatherIcon"></div>
      </div>
      <div class="forecast" id="forecast"></div>
    </section>

    <section class="card news">
      <div class="title"><h2>Gündem</h2><span class="small" id="newsUpdated">RSS yükleniyor…</span></div>
      <div id="newsList"></div>
    </section>

    <section class="card note" title="Notu değiştirmek için dokun">
      <div class="noteLabel">Not</div>
      <div id="note">Eve hoş geldin.</div>
    </section>
  </main>
  <div class="status" id="status"></div>

<script>
const $ = s => document.querySelector(s);

const bgLayers=[$("#bgA"),$("#bgB")];
const bgIds=[1015,1016,1018,1019,1039,1043,1050,1056,1067,1084];
let activeBg=-1;
let bgIndex=Math.floor(Date.now()/60000)%bgIds.length;

function showBackground(index){
  const next=activeBg===0?1:0;
  const target=bgLayers[next<0?0:next];
  const id=bgIds[index%bgIds.length];
  const url="https://picsum.photos/id/"+id+"/1920/1080";

  target.onload=()=>{
    bgLayers.forEach(el=>el.classList.remove("active"));
    target.classList.add("active");
    activeBg=bgLayers.indexOf(target);
    $("#status").textContent="BG "+id;
  };
  target.onerror=()=>{
    $("#status").textContent="BG yüklenemedi";
  };
  target.src=url+"?v="+Date.now();
}

showBackground(bgIndex);
setInterval(()=>{
  bgIndex=(bgIndex+1)%bgIds.length;
  showBackground(bgIndex);
},60*1000);


function weatherIconSvg(code){
  const sun='<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="10"/><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M50.4 13.6l-5.7 5.7M19.3 44.7l-5.7 5.7"/></svg>';
  const cloud='<svg viewBox="0 0 64 64"><path d="M18 46h28a11 11 0 0 0 1-22 16 16 0 0 0-30-2 12 12 0 0 0 1 24z"/></svg>';
  const partly='<svg viewBox="0 0 64 64"><circle cx="24" cy="23" r="9"/><path d="M24 5v6M24 35v6M6 23h6M36 23h6M11 10l4 4M33 32l4 4M37 10l-4 4"/><path d="M22 48h25a10 10 0 0 0 1-20 14 14 0 0 0-26 5 9 9 0 0 0 0 15z"/></svg>';
  const rain='<svg viewBox="0 0 64 64"><path d="M18 37h28a11 11 0 0 0 1-22 16 16 0 0 0-30-2 12 12 0 0 0 1 24z"/><path d="M22 45v7M32 45v10M42 45v7"/></svg>';
  const storm='<svg viewBox="0 0 64 64"><path d="M18 35h28a11 11 0 0 0 1-22 16 16 0 0 0-30-2 12 12 0 0 0 1 24z"/><path d="M34 39l-7 10h7l-4 10 12-14h-7l5-6"/></svg>';
  const snow='<svg viewBox="0 0 64 64"><path d="M18 36h28a11 11 0 0 0 1-22 16 16 0 0 0-30-2 12 12 0 0 0 1 24z"/><path d="M24 47h.1M32 53h.1M41 47h.1"/></svg>';
  const fog='<svg viewBox="0 0 64 64"><path d="M16 28h32M12 36h40M18 44h28"/></svg>';
  if(code===0) return sun;
  if(code===1||code===2) return partly;
  if(code===3) return cloud;
  if(code===45||code===48) return fog;
  if([51,53,55,61,63,65,80,81,82].includes(code)) return rain;
  if([71,73,75].includes(code)) return snow;
  if(code===95) return storm;
  return partly;
}
function dropSvg(){
  return '<svg viewBox="0 0 24 24"><path d="M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13z"/></svg>';
}

const weatherCodes = {
  0:"Açık",1:"Çoğunlukla açık",2:"Parçalı bulutlu",3:"Kapalı",
  45:"Sisli",48:"Kırağılı sis",51:"Hafif çisenti",53:"Çisenti",55:"Yoğun çisenti",
  61:"Hafif yağmur",63:"Yağmur",65:"Kuvvetli yağmur",71:"Hafif kar",73:"Kar",75:"Yoğun kar",
  80:"Sağanak",81:"Sağanak",82:"Kuvvetli sağanak",95:"Gök gürültülü"
};
function tick(){
  const now=new Date();
  $("#time").textContent=now.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  $("#date").textContent=now.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick,1000);

async function loadWeather(){
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude=40.99&longitude=28.65&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FIstanbul&forecast_days=4";
    const r=await fetch(url,{cache:"no-store"}); const j=await r.json();
    $("#temp").textContent=Math.round(j.current.temperature_2m)+"°";
    $("#weatherText").textContent=weatherCodes[j.current.weather_code]||"Hava durumu";\n    $("#currentWeatherIcon").innerHTML=`<span class="wxIcon">${weatherIconSvg(j.current.weather_code)}</span>`;
    $("#weatherExtra").textContent=`Hissedilen ${Math.round(j.current.apparent_temperature)}° · Nem %${j.current.relative_humidity_2m} · Yağış %${j.current.precipitation_probability??0}`;
    $("#weatherUpdated").textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
    const days=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
    $("#forecast").innerHTML=j.daily.time.map((d,i)=>{
      const dt=new Date(d+"T12:00:00");
      return `<div class="day"><div class="d">${i===0?"Bugün":days[dt.getDay()]}</div><span class="wxIcon">${weatherIconSvg(j.daily.weather_code[i])}</span><div class="rain"><span class="dropIcon">${dropSvg()}</span>%${j.daily.precipitation_probability_max[i]??0}</div><div class="temps"><span class="max">${Math.round(j.daily.temperature_2m_max[i])}°</span><span class="min">${Math.round(j.daily.temperature_2m_min[i])}°</span></div></div>`;
    }).join("");
  }catch(e){ $("#weatherText").textContent="Hava verisi alınamadı"; }
}

async function loadNews(){
  const feed="https://feeds.bbci.co.uk/turkce/rss.xml";
  const endpoints=[
    "https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feed),
    "https://api.allorigins.win/raw?url="+encodeURIComponent(feed)
  ];
  let items=[];
  for(const ep of endpoints){
    try{
      const r=await fetch(ep,{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const ct=r.headers.get("content-type")||"";
      if(ct.includes("json")){
        const j=await r.json(); items=(j.items||[]).slice(0,8);
      }else{
        const txt=await r.text(); const x=new DOMParser().parseFromString(txt,"text/xml");
        items=[...x.querySelectorAll("item")].slice(0,8).map(i=>({
          title:i.querySelector("title")?.textContent||"",
          pubDate:i.querySelector("pubDate")?.textContent||""
        }));
      }
      if(items.length) break;
    }catch(e){}
  }
  if(!items.length){
    $("#newsUpdated").textContent="RSS alınamadı";
    $("#newsList").innerHTML='<div class="newsItem"><div class="n">Haber akışı şu anda yüklenemedi.</div><div class="meta">Bir sonraki otomatik denemede tekrar kontrol edilecek.</div></div>';
    return;
  }
  $("#newsList").innerHTML=items.map(it=>`<div class="newsItem"><div class="n">${escapeHtml(it.title||"")}</div><div class="meta">${it.pubDate?new Date(it.pubDate).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"BBC Türkçe"}</div></div>`).join("");
  $("#newsUpdated").textContent="BBC Türkçe · "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

const noteKey="evDashboardNote";
$("#note").textContent=localStorage.getItem(noteKey)||"Eve hoş geldin.";
document.querySelector(".note").addEventListener("click",()=>{
  const v=prompt("Not:",$("#note").textContent);
  if(v!==null){ localStorage.setItem(noteKey,v.trim()||" "); $("#note").textContent=v.trim()||" "; }
});

loadWeather(); loadNews();
setInterval(loadWeather,10*60*1000);
setInterval(loadNews,5*60*1000);
setInterval(()=>location.reload(),6*60*60*1000);
</script>
</body>
</html>
